[package]
name = "nukeviet-2fa"
version = "1.0.0"
edition = "2021"
authors = ["NukeViet Development Team"]
description = "Modern 2FA service for NukeViet CMS with OneAuth integration"
license = "GPL-2.0-or-later"
repository = "https://github.com/nukeviet/nukeviet"

[lib]
name = "nukeviet_2fa"
crate-type = ["cdylib", "rlib"]

[dependencies]
# WebAuthn and FIDO2 support
webauthn-rs = "0.5.1"
webauthn-rs-proto = "0.5.1"

# TOTP implementation
totp-rs = "5.7.0"
base32 = "0.5"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client for OneAuth API
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
ring = "0.17"
base64 = "0.22"

# QR Code generation
qrcode = { version = "0.14", features = ["svg"] }
image = { version = "0.25", features = ["png"] }
url = "2.5"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Configuration
config = "0.14"

# Database (for future direct DB access)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono", "uuid"] }

# Rate limiting
governor = "0.6"

# Security utilities
constant_time_eq = "0.3"
zeroize = "1.7"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
